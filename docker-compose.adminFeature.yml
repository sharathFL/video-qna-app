# Safety Logic Engine — Sentry-Auditor Framework
# Port 8089 | Fully local | YOLO + SmolVLM2-500M

services:
  safety-logic:
    build: .
    container_name: vlm_safety_logic
    working_dir: /workspace
    command: ["python", "src/serve_adminFeature.py",
              "--checkpoint",     "/workspace/outputs/best.pt",
              "--smolvlm-model",  "HuggingFaceTB/SmolVLM2-500M-Video-Instruct",
              "--port",           "8089"]
    volumes:
      - ./src:/workspace/src:rw
      - ./outputs:/workspace/outputs:rw
      - ./cache/hf:/workspace/.cache/huggingface:rw
      - ./test_frames:/workspace/test_frames:ro
    environment:
      - HF_HOME=/workspace/.cache/huggingface
      - TRANSFORMERS_CACHE=/workspace/.cache/huggingface
    shm_size: "1gb"
    mem_limit: 6g
    stdin_open: true
    tty: true
    ports:
      - "8089:8089"